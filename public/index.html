<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whatsApp · message bot</title>
  <!-- Google Font + icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: radial-gradient(circle at 20% 30%, #111827, #0a0e17 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #f1f5f9;
      line-height: 1.5;
    }

    /* ——— glassmorphism premium ——— */
    .glass-orb {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(18px) saturate(200%);
      -webkit-backdrop-filter: blur(18px) saturate(200%);
      border-radius: 3.5rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 40px 70px -25px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      padding: 2.5rem 2.8rem;
      max-width: 780px;
      width: 100%;
      transition: all 0.2s ease;
    }

    @media (max-width: 550px) {
      .glass-orb { padding: 1.8rem 1.2rem; border-radius: 2.4rem; }
    }

    /* ——— header ——— */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.2rem;
    }

    .brand i {
      font-size: 2.3rem;
      background: linear-gradient(145deg, #25d366, #0f9d58);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 8px #25d36644);
    }

    .brand h1 {
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #f0f4ff, #b9c8f0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      font-weight: 400;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: -0.1rem;
      margin-bottom: 2rem;
      padding-left: 0.3rem;
      border-left: 3px solid #25d366;
      padding-left: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tagline i { color: #25d366; font-size: 0.8rem; }

    /* ——— forms ——— */
    .flow {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .field label {
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .field label i {
      color: #25d366;
      width: 1.2rem;
      font-size: 0.95rem;
    }

    .field input,
    .field select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 2.2rem;
      padding: 0.9rem 1.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #f1f5f9;
      outline: none;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .field input:focus,
    .field select:focus {
      border-color: #25d366;
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.12);
      background: rgba(0, 0, 0, 0.6);
    }

    .field input::placeholder {
      color: #5f6b89;
      font-weight: 400;
    }

    /* file upload */
    .file-zone {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 3rem;
      padding: 0.2rem 0.2rem 0.2rem 1.6rem;
      border: 1px dashed rgba(255, 255, 255, 0.06);
      transition: 0.15s;
    }

    .file-zone:hover { border-color: #25d36644; }

    .file-zone input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-zone .fname {
      font-size: 0.9rem;
      color: #b9c8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-zone .fbtn {
      background: #25d366;
      border: none;
      border-radius: 2.5rem;
      padding: 0.55rem 1.4rem;
      font-weight: 700;
      font-size: 0.8rem;
      color: #0b0e18;
      transition: 0.2s;
      white-space: nowrap;
      cursor: default;
      box-shadow: 0 6px 14px -6px #25d36655;
    }

    /* buttons */
    .btn {
      border: none;
      border-radius: 3rem;
      padding: 0.95rem 2rem;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      cursor: pointer;
      background: linear-gradient(145deg, #25d366, #18a84f);
      color: #0b0e18;
      box-shadow: 0 12px 28px -12px #25d36666;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      transform: scale(1.02);
      background: linear-gradient(145deg, #34e07a, #1ebc5a);
      box-shadow: 0 16px 32px -10px #25d36688;
    }

    .btn:active { transform: scale(0.97); }

    .btn-outline {
      background: rgba(255, 255, 255, 0.02);
      color: #eef3ff;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 20px -10px #00000088;
      transform: scale(1.01);
    }

    .btn-danger {
      background: linear-gradient(145deg, #ff4d6d, #d93a58);
      box-shadow: 0 12px 28px -12px #ff4d6d55;
    }

    .btn-danger:hover {
      background: linear-gradient(145deg, #ff5f7c, #e64462);
      box-shadow: 0 16px 32px -10px #ff4d6d77;
    }

    .row-2 {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.3rem;
    }

    .row-2 .btn { flex: 1 1 0; min-width: 130px; }

    /* ——— status panel ——— */
    .status-glass {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2.5rem;
      padding: 1.2rem 1.8rem;
      margin-top: 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.02);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.2rem;
      backdrop-filter: blur(4px);
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.3rem 1.2rem 0.3rem 0.8rem;
      border-radius: 3rem;
      font-weight: 500;
    }

    .chip i { color: #25d366; font-size: 1rem; }

    .dot {
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: #475569;
      margin-right: 0.25rem;
    }

    .dot.on { background: #25d366; box-shadow: 0 0 10px #25d366aa; }
    .dot.off { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6daa; }

    .stat-badge {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 2rem;
      padding: 0.35rem 1.2rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .stat-badge span { font-weight: 700; color: #f1f5f9; }

    .toast {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      padding: 0.8rem 1.6rem;
      border-radius: 3rem;
      border-left: 5px solid #25d366;
      font-weight: 500;
      font-size: 0.9rem;
      margin-top: 1rem;
      color: #eef3ff;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .toast i { color: #25d366; }

    .hidden { display: none !important; }

    .pair-box {
      background: #1f253a;
      border-radius: 3rem;
      padding: 0.8rem 1.6rem;
      text-align: center;
      font-weight: 600;
      border: 1px solid #25d36633;
      margin-top: 0.8rem;
      letter-spacing: 1px;
    }

    .pair-box i { color: #25d366; margin-right: 8px; }

    .text-muted { color: #64748b; font-size: 0.7rem; margin-top: 0.5rem; text-align: center; }

    @media (max-width: 480px) {
      .status-glass { flex-direction: column; align-items: stretch; }
      .row-2 { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="glass-orb" id="app">
  
  <!-- header -->
  <div class="brand">
    <i class="fab fa-whatsapp"></i>
    <h1>message•bot</h1>
  </div>
  <div class="tagline">
    <i class="fas fa-bolt"></i> 
    <span>automate · manage · go</span>
  </div>

  <!-- login zone -->
  <div id="loginZone" class="flow">
    <div class="field">
      <label><i class="fas fa-phone-alt"></i> phone number</label>
      <input type="text" id="phoneInput" placeholder="+92 300 1234567" value="923001234567">
    </div>
    <button class="btn" id="loginBtn"><i class="fas fa-key"></i> login / pair</button>
    <div id="loginToast" class="toast hidden"><i class="fas fa-circle-check"></i> <span id="loginMsg">ready</span></div>
    <div id="pairBox" class="pair-box hidden">
      <i class="fas fa-shield-alt"></i> pairing code: <span id="pairCodeDisplay" style="font-weight: 800; letter-spacing: 3px;">——</span>
    </div>
  </div>

  <!-- control zone -->
  <div id="controlZone" class="hidden flow" style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 2rem;">
    
    <div class="field">
      <label><i class="fas fa-bullseye"></i> target (ID or number)</label>
      <input type="text" id="targetInput" placeholder="923001234567-123456@g.us">
    </div>

    <div class="field">
      <label><i class="fas fa-user-tag"></i> sender prefix (optional)</label>
      <input type="text" id="hatersNameInput" placeholder="Haters name">
    </div>

    <div class="field">
      <label><i class="fas fa-clock"></i> speed (seconds)</label>
      <input type="number" id="speedInput" value="5" min="1" step="1">
    </div>

    <div class="field">
      <label><i class="fas fa-file-alt"></i> messages (.txt)</label>
      <div class="file-zone">
        <span class="fname" id="fileLabel"><i class="fas fa-upload" style="margin-right: 6px;"></i> choose file...</span>
        <span class="fbtn">browse</span>
        <input type="file" id="messageFileInput" accept=".txt">
      </div>
    </div>

    <div class="row-2">
      <button class="btn" id="startBtn"><i class="fas fa-play"></i> start</button>
      <button class="btn btn-danger" id="stopBtn"><i class="fas fa-power-off"></i> stop & logout</button>
    </div>

    <div id="msgToast" class="toast hidden"><i class="fas fa-circle-info"></i> <span id="statusMsg">idle</span></div>

    <!-- live status -->
    <div class="status-glass">
      <div class="chip"><i class="fas fa-wifi"></i> <span id="connectionBadge"><span class="dot off"></span> offline</span></div>
      <div class="chip"><i class="fas fa-envelope"></i> <span id="msgCount">0</span> msgs</div>
      <div class="chip"><i class="fas fa-paper-plane"></i> <span id="sentCount">0</span> sent</div>
      <div class="chip"><i class="fas fa-exclamation-triangle"></i> <span id="failCount">0</span> fail</div>
    </div>

    <div class="text-muted">
      <i class="fas fa-database" style="margin-right: 4px;"></i> session: <span id="sessionKeyDisplay">—</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ——— refs ———
    const $ = id => document.getElementById(id);
    const loginZone = $('loginZone');
    const controlZone = $('controlZone');
    const phoneInput = $('phoneInput');
    const loginBtn = $('loginBtn');
    const loginToast = $('loginToast');
    const loginMsg = $('loginMsg');
    const pairBox = $('pairBox');
    const pairCodeDisplay = $('pairCodeDisplay');

    const targetInput = $('targetInput');
    const hatersNameInput = $('hatersNameInput');
    const speedInput = $('speedInput');
    const fileInput = $('messageFileInput');
    const fileLabel = $('fileLabel');
    const startBtn = $('startBtn');
    const stopBtn = $('stopBtn');
    const msgToast = $('msgToast');
    const statusMsg = $('statusMsg');

    const connectionBadge = $('connectionBadge');
    const msgCount = $('msgCount');
    const sentCount = $('sentCount');
    const failCount = $('failCount');
    const sessionKeyDisplay = $('sessionKeyDisplay');

    // ——— state ———
    let uniqueKey = null;
    let pollInterval = null;
    let isConnected = false;

    // ——— helpers ———
    function setToast(el, msg, type = 'info') {
      el.classList.remove('hidden');
      const span = el.querySelector('span');
      if (span) span.textContent = msg;
      const icon = el.querySelector('i');
      if (type === 'success') {
        icon.className = 'fas fa-circle-check';
        el.style.borderLeftColor = '#25d366';
      } else if (type === 'error') {
        icon.className = 'fas fa-circle-exclamation';
        el.style.borderLeftColor = '#ff4d6d';
      } else {
        icon.className = 'fas fa-circle-info';
        el.style.borderLeftColor = '#4a8eff';
      }
    }

    function setLoginToast(msg, isError = false) {
      setToast(loginToast, msg, isError ? 'error' : 'success');
    }

    function setMsgToast(msg, type = 'info') {
      setToast(msgToast, msg, type);
    }

    function updateUI() {
      if (!uniqueKey) return;
      fetch(`/sessionStatus/${uniqueKey}`)
        .then(r => r.json())
        .then(data => {
          if (!data.exists) return;
          isConnected = data.connected || false;
          const badge = connectionBadge;
          if (isConnected) {
            badge.innerHTML = `<span class="dot on"></span> online`;
          } else {
            badge.innerHTML = `<span class="dot off"></span> offline`;
          }
          msgCount.textContent = data.messageCount || 0;
          sentCount.textContent = data.sent || 0;
          failCount.textContent = data.failed || 0;
          sessionKeyDisplay.textContent = uniqueKey.substring(0, 12) + '…';
          if (data.target) targetInput.value = data.target;
          if (data.speed) speedInput.value = data.speed;
        })
        .catch(() => {});
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(updateUI, 2500);
      updateUI();
    }

    function stopPolling() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    }

    // ——— login ———
    loginBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      if (!phone) { setLoginToast('Phone number required', true); return; }
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> connecting...';
      setLoginToast('Requesting pairing...');

      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone })
        });
        const data = await resp.json();
        if (!data.success) {
          setLoginToast(data.message || 'Login error', true);
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-key"></i> login / pair';
          return;
        }
        uniqueKey = data.uniqueKey;
        if (data.pairingCode) {
          pairBox.classList.remove('hidden');
          pairCodeDisplay.textContent = data.pairingCode;
          setLoginToast('Pairing code generated!');
        } else if (data.connected) {
          pairBox.classList.add('hidden');
          setLoginToast('Already connected!');
          loginZone.classList.add('hidden');
          controlZone.classList.remove('hidden');
          startPolling();
        } else {
          setLoginToast('Connected! Waiting for pairing...');
        }

        if (uniqueKey) {
          setTimeout(() => {
            loginZone.classList.add('hidden');
            controlZone.classList.remove('hidden');
            sessionKeyDisplay.textContent = uniqueKey.substring(0, 12) + '…';
            startPolling();
          }, 600);
        }
      } catch (e) {
        setLoginToast('Network error: ' + e.message, true);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-key"></i> login / pair';
      }
    });

    // ——— start messaging ———
    startBtn.addEventListener('click', async () => {
      if (!uniqueKey) { setMsgToast('No session. Login first.', 'error'); return; }
      const target = targetInput.value.trim();
      const speed = speedInput.value.trim();
      const hatersName = hatersNameInput.value.trim();
      const file = fileInput.files[0];

      if (!target) { setMsgToast('Target required', 'error'); return; }
      if (!speed || parseInt(speed) < 1) { setMsgToast('Speed must be >= 1', 'error'); return; }
      if (!file) { setMsgToast('Select a .txt file', 'error'); return; }

      const formData = new FormData();
      formData.append('uniqueKey', uniqueKey);
      formData.append('target', target);
      formData.append('hatersName', hatersName);
      formData.append('speed', speed);
      formData.append('messageFile', file);

      startBtn.disabled = true;
      startBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> starting...';
      setMsgToast('Uploading & starting...');

      try {
        const resp = await fetch('/startMessaging', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        if (data.success) {
          setMsgToast(`✅ ${data.message} (${data.messageCount} msgs)`, 'success');
          updateUI();
        } else {
          setMsgToast('❌ ' + (data.message || 'Start failed'), 'error');
        }
      } catch (e) {
        setMsgToast('Network error: ' + e.message, 'error');
      } finally {
        startBtn.disabled = false;
        startBtn.innerHTML = '<i class="fas fa-play"></i> start';
        fileInput.value = '';
        fileLabel.innerHTML = '<i class="fas fa-upload" style="margin-right:6px;"></i> choose file...';
      }
    });

    // ——— stop & logout ———
    stopBtn.addEventListener('click', async () => {
      if (!uniqueKey) { setMsgToast('No session to stop', 'error'); return; }
      stopBtn.disabled = true;
      stopBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> stopping...';
      try {
        const resp = await fetch('/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uniqueKey })
        });
        const data = await resp.json();
        if (data.success) {
          setMsgToast('✅ Stopped & logged out.', 'success');
          stopPolling();
          loginZone.classList.remove('hidden');
          controlZone.classList.add('hidden');
          pairBox.classList.add('hidden');
          uniqueKey = null;
          sessionKeyDisplay.textContent = '—';
          connectionBadge.innerHTML = `<span class="dot off"></span> offline`;
        } else {
          setMsgToast('❌ ' + (data.message || 'Stop failed'), 'error');
        }
      } catch (e) {
        setMsgToast('Network error: ' + e.message, 'error');
      } finally {
        stopBtn.disabled = false;
        stopBtn.innerHTML = '<i class="fas fa-power-off"></i> stop & logout';
      }
    });

    // ——— file label ———
    fileInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        fileLabel.innerHTML = `<i class="fas fa-file-lines" style="margin-right:6px;"></i> ${this.files[0].name}`;
      } else {
        fileLabel.innerHTML = '<i class="fas fa-upload" style="margin-right:6px;"></i> choose file...';
      }
    });

    console.log('🚀 ready — login to start');
  })();
</script>

</body>
</html>
